# Isolated synthetic environment. Pinned CLI: package.json.
# Run through npm run local:start / local:reset; never link this project.
project_id = "urblo-isolated-v1"

[api]
enabled = true
port = 57321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 57322
shadow_port = 57320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 57324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8788"
additional_redirect_urls = ["http://127.0.0.1:8788/admin/account-setup?flow=invite", "http://127.0.0.1:8788/admin/account-setup?flow=recovery"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000

[edge_runtime]
enabled = false

[analytics]
enabled = false
